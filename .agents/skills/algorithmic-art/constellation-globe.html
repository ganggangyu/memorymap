<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Constellation Cartography — Memory Globe</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Lora:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --cream: #fef9f0;
            --ink: #3c2415;
            --gold: #c4a97d;
            --seal: #a0522d;
            --paper: #faf3e3;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: var(--cream);
            min-height: 100vh;
            color: var(--ink);
        }
        .container { display: flex; min-height: 100vh; padding: 20px; gap: 20px; }
        .sidebar {
            width: 300px; flex-shrink: 0;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            padding: 24px; border-radius: 12px;
            box-shadow: 0 10px 30px rgba(60,36,21,0.1);
            overflow-y: auto;
        }
        .sidebar h1 { font-family: 'Lora', serif; font-size: 22px; color: var(--ink); margin-bottom: 4px; }
        .sidebar .subtitle { color: var(--gold); font-size: 13px; margin-bottom: 24px; }
        .control-section { margin-bottom: 24px; }
        .control-section h3 { font-size: 14px; font-weight: 600; color: var(--ink); margin-bottom: 12px; }
        .seed-input {
            width: 100%; background: var(--paper); padding: 10px; border-radius: 8px;
            font-family: 'Courier New', monospace; font-size: 14px; margin-bottom: 10px;
            border: 1px solid #e0d5b8; text-align: center;
        }
        .seed-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
        .control-group { margin-bottom: 16px; }
        .control-group label { display: block; font-size: 13px; color: var(--ink); margin-bottom: 6px; }
        .slider-container { display: flex; align-items: center; gap: 10px; }
        .slider-container input[type="range"] { flex: 1; height: 4px; background: #e0d5b8; border-radius: 2px; }
        .value-display { font-family: 'Courier New', monospace; font-size: 11px; color: var(--gold); min-width: 50px; text-align: right; }
        .color-group { margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
        .color-group input[type="color"] { width: 28px; height: 28px; border: none; border-radius: 6px; cursor: pointer; }
        .button {
            background: var(--seal); color: white; border: none; padding: 10px 14px;
            border-radius: 6px; font-size: 13px; cursor: pointer; transition: all 0.2s; width: 100%;
        }
        .button:hover { opacity: 0.9; transform: translateY(-1px); }
        .button.secondary { background: var(--ink); }
        .button.tertiary { background: var(--gold); color: var(--ink); }
        .button-row { display: flex; gap: 8px; }
        .button-row .button { flex: 1; }
        .canvas-area { flex: 1; display: flex; align-items: center; justify-content: center; }
        #canvas-container {
            width: 100%; max-width: 900px; border-radius: 12px;
            overflow: hidden; box-shadow: 0 20px 40px rgba(60,36,21,0.12);
        }
        #canvas-container canvas { display: block; width: 100% !important; height: auto !important; }
    </style>
</head>
<body>
<div class="container">
    <div class="sidebar">
        <h1>Constellation Cartography</h1>
        <div class="subtitle">Antique Memory Globe — Generative</div>
        <div class="control-section">
            <h3>Seed</h3>
            <input type="number" id="seed-input" class="seed-input" value="48255" onchange="updateSeed()">
            <div class="seed-controls">
                <button class="button secondary" onclick="previousSeed()">← Prev</button>
                <button class="button secondary" onclick="nextSeed()">Next →</button>
            </div>
            <button class="button tertiary" onclick="randomSeedAndUpdate()">↻ Random Seed</button>
        </div>
        <div class="control-section">
            <h3>Parameters</h3>
            <div class="control-group">
                <label>Memory Points</label>
                <div class="slider-container">
                    <input type="range" id="memories" min="3" max="30" step="1" value="8" oninput="updateParam('memories', this.value)">
                    <span class="value-display" id="memories-value">8</span>
                </div>
            </div>
            <div class="control-group">
                <label>Dot Density</label>
                <div class="slider-container">
                    <input type="range" id="density" min="2000" max="12000" step="500" value="5000" oninput="updateParam('density', this.value)">
                    <span class="value-display" id="density-value">5000</span>
                </div>
            </div>
            <div class="control-group">
                <label>Constellation Threads</label>
                <div class="slider-container">
                    <input type="range" id="threads" min="0" max="20" step="1" value="6" oninput="updateParam('threads', this.value)">
                    <span class="value-display" id="threads-value">6</span>
                </div>
            </div>
            <div class="control-group">
                <label>Rotation Speed</label>
                <div class="slider-container">
                    <input type="range" id="speed" min="0" max="30" step="1" value="4" oninput="updateParam('speed', this.value)">
                    <span class="value-display" id="speed-value">4</span>
                </div>
            </div>
        </div>
        <div class="control-section">
            <h3>Colors</h3>
            <div class="color-group">
                <input type="color" id="colorBg" value="#fef9f0" onchange="updateColor('colorBg', this.value)"><label>Parchment</label>
            </div>
            <div class="color-group">
                <input type="color" id="colorInk" value="#3c2415" onchange="updateColor('colorInk', this.value)"><label>Ink Lines</label>
            </div>
            <div class="color-group">
                <input type="color" id="colorGold" value="#c4a97d" onchange="updateColor('colorGold', this.value)"><label>Constellations</label>
            </div>
            <div class="color-group">
                <input type="color" id="colorSeal" value="#a0522d" onchange="updateColor('colorSeal', this.value)"><label>Memory Marks</label>
            </div>
        </div>
        <div class="control-section">
            <h3>Actions</h3>
            <div class="button-row">
                <button class="button" onclick="resetParameters()">Reset</button>
            </div>
        </div>
    </div>
    <div class="canvas-area">
        <div id="canvas-container"><div class="loading">Drawing antique globe...</div></div>
    </div>
</div>

<script>
let params = {
    seed: 48255,
    memories: 8,
    density: 5000,
    threads: 6,
    speed: 4,
    colors: { bg: '#fef9f0', ink: '#3c2415', gold: '#c4a97d', seal: '#a0522d' }
};
let defaultParams;
let memoryPoints = [];
let globeDots = [];
let angle = 0;
let cx, cy, R;

function setup() {
    let c = createCanvas(900, 900);
    c.parent('canvas-container');
    defaultParams = JSON.parse(JSON.stringify(params));
    cx = width / 2; cy = height / 2; R = min(width, height) * 0.38;
    document.querySelector('.loading').style.display = 'none';
    initGlobe();
}

function initGlobe() {
    randomSeed(params.seed);
    noiseSeed(params.seed);
    angle = 0;

    // Generate memory points (longitude, latitude)
    memoryPoints = [];
    for (let i = 0; i < params.memories; i++) {
        memoryPoints.push({
            lng: random(-180, 180),
            lat: random(-60, 60),
            id: i,
        });
    }

    // Generate globe surface dots
    globeDots = [];
    for (let i = 0; i < params.density; i++) {
        let lng = random(-180, 180);
        let lat = random(-90, 90);
        // Cosine-weighted: more dots near equator (like real globe projection)
        if (random() > cos(radians(lat)) * 1.2 + 0.1) { i--; continue; }
        globeDots.push({ lng, lat, baseAlpha: random(0.3, 0.8), size: random(1, 2.5) });
    }
}

function draw() {
    background(params.colors.bg);
    angle += params.speed * 0.0015;

    // Draw latitude rings (brass meridians)
    strokeWeight(0.6);
    for (let lat = -60; lat <= 60; lat += 30) {
        let rad = R * cos(radians(lat));
        let y = cy - R * sin(radians(lat)) * 0.65;
        noFill();
        let inkCol = color(params.colors.ink);
        inkCol.setAlpha(20 + abs(lat) * 0.5);
        stroke(inkCol);
        ellipse(cx, y, rad * 2, rad * 0.6);
    }

    // Vertical meridian lines
    for (let lng = 0; lng < 180; lng += 30) {
        let inkCol = color(params.colors.ink);
        inkCol.setAlpha(15);
        stroke(inkCol);
        let a = radians(lng + angle * 30);
        let x = cx + R * cos(a) * 0.9;
        let y1 = cy - R * 0.65;
        let y2 = cy + R * 0.65;
        line(x, y1, x, y2);
    }

    // Center meridian (stronger)
    let mc = color(params.colors.gold);
    mc.setAlpha(60);
    stroke(mc);
    strokeWeight(1);
    line(cx, cy - R * 0.72, cx, cy + R * 0.72);

    // Draw globe dots (with rotation)
    noStroke();
    for (let dot of globeDots) {
        let a = radians(dot.lng + angle * 20);
        let x = cx + R * cos(a) * cos(radians(dot.lat));
        let y = cy - R * sin(radians(dot.lat)) * 0.65;
        let z = R * sin(a) * cos(radians(dot.lat));
        if (z < -R * 0.1) continue; // back face culling
        let alpha = map(z, -R * 0.1, R, 0.1, dot.baseAlpha);
        let inkCol = color(params.colors.ink);
        inkCol.setAlpha(alpha * 255);
        fill(inkCol);
        ellipse(x, y, dot.size, dot.size);
    }

    // Draw memory points (seal-red markers)
    for (let mp of memoryPoints) {
        let a = radians(mp.lng + angle * 20);
        let x = cx + R * cos(a) * cos(radians(mp.lat));
        let y = cy - R * sin(radians(mp.lat)) * 0.65;
        let z = R * sin(a) * cos(radians(mp.lat));
        if (z < -R * 0.1) continue;

        // Outer glow ring
        let glowCol = color(params.colors.gold);
        glowCol.setAlpha(40 + sin(frameCount * 0.03 + mp.id) * 15);
        fill(glowCol); noStroke();
        ellipse(x, y, 14, 14);

        // Inner seal dot
        let sealCol = color(params.colors.seal);
        sealCol.setAlpha(z > 0 ? 255 : 120);
        fill(sealCol);
        ellipse(x, y, 6, 6);

        // Gold ring around marker
        let ringCol = color(params.colors.gold);
        ringCol.setAlpha(80);
        noFill(); stroke(ringCol); strokeWeight(1.2);
        ellipse(x, y, 10, 10);
    }

    // Draw constellation threads between points
    let sortedByLng = [...memoryPoints].sort((a, b) => a.lng - b.lng);
    for (let i = 0; i < min(params.threads, sortedByLng.length - 1); i++) {
        let p1 = sortedByLng[i];
        let p2 = sortedByLng[i + 1];
        let a1 = radians(p1.lng + angle * 20);
        let a2 = radians(p2.lng + angle * 20);
        let x1 = cx + R * cos(a1) * cos(radians(p1.lat));
        let y1 = cy - R * sin(radians(p1.lat)) * 0.65;
        let x2 = cx + R * cos(a2) * cos(radians(p2.lat));
        let y2 = cy - R * sin(radians(p2.lat)) * 0.65;
        let z1 = R * sin(a1) * cos(radians(p1.lat));
        let z2 = R * sin(a2) * cos(radians(p2.lat));
        if (z1 < -R * 0.1 && z2 < -R * 0.1) continue;

        let goldCol = color(params.colors.gold);
        goldCol.setAlpha(50 + (i % 3) * 10);
        stroke(goldCol);
        strokeWeight(0.8 + random(-0.2, 0.2));
        // Curved arc (quadratic bezier)
        let mx = (x1 + x2) / 2;
        let my = (y1 + y2) / 2 - random(10, 30);
        noFill();
        bezier(x1, y1, mx, y1 - 15, mx, y2 + 15, x2, y2);
    }

    // Title text
    noStroke();
    let titleCol = color(params.colors.ink);
    titleCol.setAlpha(40);
    fill(titleCol);
    textAlign(CENTER);
    textFont('Lora');
    textSize(11);
    text('CELESTIAL MEMORY GLOBE', cx, cy + R + 50);
    textSize(9);
    text(`${params.memories} memories · seed ${params.seed}`, cx, cy + R + 70);
}

// UI handlers
function updateParam(name, value) {
    params[name] = name === 'memories' || name === 'threads' || name === 'density' || name === 'speed' ? int(value) : value;
    document.getElementById(name + '-value').textContent = value;
    initGlobe();
}

function updateColor(id, value) {
    params.colors[id.replace('color', '').toLowerCase()] = value;
}

function updateSeed() {
    let v = parseInt(document.getElementById('seed-input').value);
    if (v > 0) { params.seed = v; initGlobe(); }
}

function updateSeedDisplay() { document.getElementById('seed-input').value = params.seed; }

function previousSeed() { params.seed = max(1, params.seed - 1); updateSeedDisplay(); initGlobe(); }
function nextSeed() { params.seed++; updateSeedDisplay(); initGlobe(); }
function randomSeedAndUpdate() { params.seed = floor(random(99999)) + 1; updateSeedDisplay(); initGlobe(); }

function resetParameters() {
    params = JSON.parse(JSON.stringify(defaultParams));
    ['memories','density','threads','speed'].forEach(n => {
        document.getElementById(n).value = params[n];
        document.getElementById(n + '-value').textContent = params[n];
    });
    updateSeedDisplay();
    initGlobe();
}

window.addEventListener('load', () => updateSeedDisplay());
</script>
</body>
</html>
