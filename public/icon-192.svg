<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1b4b"/>
      <stop offset="50%" style="stop-color:#312e81"/>
      <stop offset="100%" style="stop-color:#4c1d95"/>
    </linearGradient>
    <linearGradient id="heart" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f43f5e"/>
      <stop offset="100%" style="stop-color:#e11d48"/>
    </linearGradient>
    <linearGradient id="pin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fb7185"/>
      <stop offset="100%" style="stop-color:#e11d48"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="192" height="192" rx="38" fill="url(#bg)"/>
  
  <!-- Subtle map grid lines -->
  <g opacity="0.08" stroke="#c4b5fd" stroke-width="0.5">
    <line x1="20" y1="60" x2="172" y2="60"/><line x1="20" y1="80" x2="172" y2="80"/>
    <line x1="20" y1="100" x2="172" y2="100"/><line x1="20" y1="120" x2="172" y2="120"/>
    <line x1="20" y1="140" x2="172" y2="140"/><line x1="20" y1="160" x2="172" y2="160"/>
    <line x1="50" y1="40" x2="50" y2="175"/><line x1="80" y1="40" x2="80" y2="175"/>
    <line x1="110" y1="40" x2="110" y2="175"/><line x1="140" y1="40" x2="140" y2="175"/>
  </g>
  
  <!-- Orbit path (subtle) -->
  <ellipse cx="96" cy="88" rx="68" ry="12" fill="none" stroke="#a78bfa" stroke-width="1" opacity="0.15" stroke-dasharray="4 8"/>
  
  <!-- Tiny stars -->
  <g fill="white" opacity="0.5">
    <circle cx="38" cy="48" r="1.2"/><circle cx="152" cy="42" r="1"/>
    <circle cx="28" cy="100" r="0.8"/><circle cx="165" cy="72" r="1.1"/>
    <circle cx="42" cy="155" r="0.9"/><circle cx="148" cy="132" r="1"/>
    <circle cx="100" cy="34" r="0.7"/><circle cx="68" cy="42" r="1"/>
  </g>
  
  <!-- Map pin shape -->
  <g transform="translate(96, 72)">
    <!-- Pin shadow -->
    <ellipse cx="-2" cy="48" rx="16" ry="5" fill="black" opacity="0.25"/>
    <!-- Pin body -->
    <path d="M0 -44 C-28 -44 -36 -16 -36 0 C-36 14 -20 32 0 48 C20 32 36 14 36 0 C36 -16 28 -44 0 -44Z" fill="url(#pin)"/>
    <!-- Inner circle (hole) -->
    <circle cx="0" cy="-11" r="17" fill="#1e1b4b" stroke="#f43f5e" stroke-width="2"/>
    <!-- Heart inside pin -->
    <g transform="translate(0, -9)">
      <path d="M0 -4 C-2 -10 -10 -12 -10 -6 C-10 -2 0 6 0 6 C0 6 10 -2 10 -6 C10 -12 2 -10 0 -4Z" fill="url(#heart)"/>
    </g>
  </g>
  
  <!-- Winding path line (journey) -->
  <g fill="none" stroke="#f43f5e" stroke-width="2.5" stroke-linecap="round" opacity="0.6">
    <path d="M40 155 Q55 130 72 140 Q88 148 96 138 Q110 122 128 130 Q148 138 158 120"/>
    <!-- small dots on path -->
    <circle cx="72" cy="140" r="3" fill="#fb7185"/>
    <circle cx="96" cy="138" r="3" fill="#fb7185"/>
    <circle cx="128" cy="130" r="3" fill="#fb7185"/>
  </g>
</svg>
